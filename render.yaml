services:
  - type: web
    name: weathersphere
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
